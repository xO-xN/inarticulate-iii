<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="user-scalable=no, initial-scale=1, maximum-scale=1, viewport-fit=cover"
        />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />
        <meta name="apple-mobile-web-app-title" content="Sketch" />

        <title>Sketch</title>

        <link rel="stylesheet" type="text/css" href="style.css" />

        <script src="libraries/p5.min.js"></script>
        <script>
            document.write(
                '\x3Cscript src="http://' +
                    location.hostname +
                    ':6868/socket.io/socket.io.js"\x3E\x3C/script\x3E',
            );
        </script>
    </head>

    <body>
        <div id="qr-overlay">
            <div id="qr-wrapper">
                <img id="qr-image" src="/qr" alt="Scan to join" />
            </div>
            <p id="qr-label">Scan to join</p>
        </div>

        <div id="badge-user" class="badge">
            <span id="badge-user-icon">&#x1F3B9;</span>
            <span id="badge-user-text">—</span>
        </div>

        <div id="badge-clients" class="badge">
            <span id="badge-clients-text">0</span>
            <span id="badge-clients-icon">&#x1F6DC;</span>
        </div>

        <div id="connection-status" class="hidden">
            <span id="status-dot"></span>
            <span id="status-text">Connected</span>
        </div>

        <button id="qr-toggle" title="Toggle QR Code">
            <span id="qr-toggle-icon">&#x2B06;</span>
        </button>

        <script src="sketch.js"></script>
    </body>
</html>
